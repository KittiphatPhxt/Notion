<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicon -->
    <link rel="icon" href="https://www.notion.so/images/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="https://www.notion.so/images/meta/default.png">
    <title>Notion Group</title>


    <!-- TailwindCSS v3 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'Noto Sans Thai', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen bg-gradient-to-br from-sky-50 via-white to-sky-100 font-sans overflow-x-hidden">

    <!-- Animated Background Blobs -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden" style="z-index: -10;" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Floating Particles -->
    <div id="particles" class="fixed inset-0 pointer-events-none" style="z-index: -5;" aria-hidden="true"></div>

    <!-- Main Content -->
    <main class="relative min-h-screen flex flex-col items-center justify-center px-4 py-12">

        <!-- Logo / Brand Section -->
        <div id="brand" class="text-center mb-10 opacity-0 translate-y-8">
            <div
                class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-white shadow-xl shadow-sky-200/50 border border-sky-100 mb-5 p-3.5 hover:scale-105 transition-all duration-300">

            <h1

                Notion Group
            </h1>
            <p class="mt-3 text-lg md:text-xl text-sky-700/70 font-light max-w-md mx-auto">
                เรียนรู้การใช้ Notion<br>เพื่อเพิ่มประสิทธิภาพการทำงาน
            </p>
        </div>

        <!-- Buttons Grid -->
        <div id="buttons-grid" class="grid grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-5 max-w-3xl w-full">

            <!-- Button 1: View Slides -->
            <a href="#" id="btn-slides" class="btn-card group opacity-0 translate-y-8" target="_blank" rel="noopener">
                <div class="btn-card-inner">
                    <div
                        class="btn-icon bg-gradient-to-br from-blue-400 to-blue-600 group-hover:scale-110 transition-transform duration-300">
                        <i data-lucide="presentation" class="w-7 h-7 text-white"></i>
                    </div>
                    <span class="btn-label">ดูสไลด์นำเสนอ</span>
                    <span class="btn-sublabel">Presentation Slides</span>
                </div>
                <div class="btn-shine"></div>
            </a>

            <!-- Button 2: Quiz -->
            <a href="#" id="btn-quiz" class="btn-card group opacity-0 translate-y-8" target="_blank" rel="noopener">
                <div class="btn-card-inner">
                    <div
                        class="btn-icon bg-gradient-to-br from-emerald-400 to-emerald-600 group-hover:scale-110 transition-transform duration-300">
                        <i data-lucide="clipboard-check" class="w-7 h-7 text-white"></i>
                    </div>
                    <span class="btn-label">แบบทดสอบ</span>
                    <span class="btn-sublabel">Take a Quiz</span>
                </div>
                <div class="btn-shine"></div>
            </a>

            <!-- Button 3: Notion Website -->

                target="_blank" rel="noopener">

                        class="btn-icon bg-gradient-to-br from-gray-700 to-gray-900 group-hover:scale-110 transition-transform duration-300">

                    <span class="btn-sublabel">Go to Notion</span>
                </div>

            </a>

            <!-- Button 4: Template Workshop -->
            <a href="#" id="btn-workshop" class="btn-card group opacity-0 translate-y-8" target="_blank" rel="noopener">
                <div class="btn-card-inner">
                    <div
                        class="btn-icon bg-gradient-to-br from-violet-400 to-violet-600 group-hover:scale-110 transition-transform duration-300">
                        <svg class="w-7 h-7" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">

                target="_blank" rel="noopener">
                <div class="btn-card-inner">
                    <div
                        class="btn-icon bg-gradient-to-br from-amber-400 to-orange-500 group-hover:scale-110 transition-transform duration-300">
                        <svg class="w-7 h-7" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">

            <!-- Button 6: Kahoot Game -->
            <a href="https://kahoot.it/" id="btn-kahoot" class="btn-card group opacity-0 translate-y-8" target="_blank"
                rel="noopener">
                <div class="btn-card-inner">
                    <div
                        class="btn-icon bg-gradient-to-br from-pink-400 to-rose-500 group-hover:scale-110 transition-transform duration-300">
                        <i data-lucide="gamepad-2" class="w-7 h-7 text-white"></i>
                    </div>
                    <span class="btn-label">เล่นเกม Kahoot</span>

        <!-- Footer -->
        <footer id="footer" class="mt-14 text-center opacity-0 translate-y-4">
            <div class="flex items-center justify-center gap-2 text-sky-400/60">
                <i data-lucide="heart" class="w-4 h-4"></i>
                <span class="text-sm font-light">Made with Notion Group</span>
                <i data-lucide="heart" class="w-4 h-4"></i>
            </div>
        </footer>

    <!-- Script -->
